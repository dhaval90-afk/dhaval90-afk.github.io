<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tasks — Workhall Leads</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="nav"></div>
  <div class="page">
    <div class="page-header">
      <h1>Tasks</h1>
    </div>

    <div class="filters">
      <select id="statusFilter">
        <option value="">All open + completed</option>
        <option value="Open" selected>Open only</option>
        <option value="Completed">Completed only</option>
      </select>
      <select id="ownerFilter"><option value="">All owners</option></select>
      <select id="typeFilter"><option value="">All types</option></select>
    </div>

    <div class="grid grid-3" id="summaryCards"></div>

    <div class="section-title">Overdue</div>
    <div id="overdueList"></div>
    <div class="section-title">Due today</div>
    <div id="todayList"></div>
    <div class="section-title">Upcoming</div>
    <div id="upcomingList"></div>
    <div class="section-title">Completed</div>
    <div id="completedList"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="db.js"></script>
  <script>
    function taskRow(t) {
      return `
        <div class="card" style="padding:10px 14px; margin-bottom:8px;">
          <div class="flex-between">
            <div>
              <strong>${t.task_type}</strong>
              <span class="text-muted"> — ${t.companies ? t.companies.company_name : ''}${t.contacts ? ' · ' + t.contacts.contact_name : ''}</span>
              <div class="text-muted">Owner: ${t.owner || 'unassigned'} · Due: ${fmtDateTime(t.due_date)} ${t.priority ? priorityBadge(t.priority) : ''}</div>
            </div>
            <div class="flex">
              ${t.company_id ? `<a href="company.html?id=${t.company_id}" class="btn btn-sm">Open</a>` : ''}
              ${t.status === 'Open' ? `<button class="btn btn-sm complete-btn" data-id="${t.id}">Complete</button>` : '<span class="badge badge-verified">Done</span>'}
            </div>
          </div>
        </div>`;
    }

    function populateSelect(el, values, includeAll) {
      el.innerHTML = (includeAll ? '<option value="">All</option>' : '') + values.map((v) => `<option value="${v}">${v}</option>`).join('');
    }

    async function refresh() {
      const status = document.getElementById('statusFilter').value;
      const owner = document.getElementById('ownerFilter').value;
      const type = document.getElementById('typeFilter').value;
      const tasks = await fetchTasks({ status: status || undefined, owner: owner || undefined });
      const filtered = type ? tasks.filter((t) => t.task_type === type) : tasks;

      const now = new Date();
      const todayStr = now.toDateString();
      const overdue = filtered.filter((t) => t.status === 'Open' && t.due_date && new Date(t.due_date) < now && new Date(t.due_date).toDateString() !== todayStr);
      const today = filtered.filter((t) => t.status === 'Open' && t.due_date && new Date(t.due_date).toDateString() === todayStr);
      const upcoming = filtered.filter((t) => t.status === 'Open' && t.due_date && new Date(t.due_date) > now && new Date(t.due_date).toDateString() !== todayStr);
      const completed = filtered.filter((t) => t.status === 'Completed');

      document.getElementById('overdueList').innerHTML = overdue.map(taskRow).join('') || '<div class="empty">Nothing overdue.</div>';
      document.getElementById('todayList').innerHTML = today.map(taskRow).join('') || '<div class="empty">Nothing due today.</div>';
      document.getElementById('upcomingList').innerHTML = upcoming.map(taskRow).join('') || '<div class="empty">Nothing upcoming.</div>';
      document.getElementById('completedList').innerHTML = completed.slice(0, 25).map(taskRow).join('') || '<div class="empty">No completed tasks yet.</div>';

      document.getElementById('summaryCards').innerHTML = `
        <div class="card stat"><div class="value">${overdue.length}</div><div class="label">Overdue</div></div>
        <div class="card stat"><div class="value">${today.length}</div><div class="label">Due today</div></div>
        <div class="card stat"><div class="value">${filtered.filter((t) => t.status === 'Open').length}</div><div class="label">Total open</div></div>
      `;

      document.querySelectorAll('.complete-btn').forEach((btn) => {
        btn.addEventListener('click', async () => { await completeTask(btn.dataset.id); await refresh(); });
      });

      const owners = [...new Set(tasks.map((t) => t.owner).filter(Boolean))];
      const types = [...new Set(tasks.map((t) => t.task_type).filter(Boolean))];
      const ownerSel = document.getElementById('ownerFilter');
      const typeSel = document.getElementById('typeFilter');
      const curOwner = ownerSel.value, curType = typeSel.value;
      populateSelect(ownerSel, owners, true); ownerSel.value = curOwner;
      populateSelect(typeSel, types, true); typeSel.value = curType;
    }

    ['statusFilter', 'ownerFilter', 'typeFilter'].forEach((id) => document.getElementById(id).addEventListener('change', refresh));

    (async function init() {
      await requireAuth();
      await renderNav('tasks');
      await refresh();
    })();
  </script>
</body>
</html>
