<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Company — Workhall Leads</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="nav"></div>
  <div class="page" id="page" style="display:none;">
    <a href="pipeline.html" class="text-muted">&larr; Back to pipeline</a>

    <div class="page-header">
      <div>
        <h1 id="companyName">—</h1>
        <div class="flex" id="badgeRow"></div>
      </div>
      <div class="flex">
        <button id="overrideStageBtn" class="btn btn-sm">Override stage</button>
        <button id="overridePriorityBtn" class="btn btn-sm">Override priority</button>
      </div>
    </div>

    <div class="grid grid-2">
      <div class="card">
        <h3>Company details</h3>
        <form id="companyForm">
          <div class="form-row">
            <div><label>Company name</label><input name="company_name" /></div>
            <div><label>Domain</label><input name="domain" /></div>
          </div>
          <div class="form-row">
            <div><label>Industry</label><input name="industry" /></div>
            <div><label>Company size</label><input name="company_size" /></div>
          </div>
          <div class="form-row">
            <div><label>Geography</label><input name="geography" /></div>
            <div><label>Revenue</label><input name="revenue" /></div>
          </div>
          <div class="form-row">
            <div>
              <label>Source</label>
              <select name="source" id="sourceSelect"></select>
            </div>
            <div>
              <label>Source category</label>
              <select name="source_category">
                <option value="Inbound">Inbound</option>
                <option value="Outbound">Outbound</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div><label>Owner</label><input name="owner" /></div>
            <div>
              <label>Verification status</label>
              <select name="verification_status">
                <option>Pending</option><option>Verified</option><option>Rejected</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn-primary" style="margin-top:16px;">Save</button>
        </form>
      </div>

      <div class="card">
        <h3>Qualification</h3>
        <p id="qualSummary"></p>
        <div class="flex">
          <button id="qualifyBtn" class="btn">Mark Qualified</button>
          <button id="notQualifyBtn" class="btn">Mark Not Qualified</button>
        </div>
        <div class="hr"></div>
        <h3>SLA</h3>
        <p id="slaSummary"></p>
      </div>
    </div>

    <div class="card">
      <div class="flex-between">
        <h3>Contacts</h3>
        <button id="addContactBtn" class="btn btn-sm">+ Add contact</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Title</th><th>Email</th><th>Phone / WhatsApp</th><th>LinkedIn</th><th>Primary</th><th>Verification</th></tr></thead>
          <tbody id="contactsBody"></tbody>
        </table>
      </div>
      <form id="contactForm" style="display:none; margin-top:14px;">
        <div class="form-row">
          <div><label>Name *</label><input name="contact_name" required /></div>
          <div><label>Title</label><input name="title" /></div>
        </div>
        <div class="form-row">
          <div><label>Email</label><input name="email" type="email" /></div>
          <div><label>Phone / WhatsApp</label><input name="phone_whatsapp" /></div>
        </div>
        <div class="form-row">
          <div><label>LinkedIn URL</label><input name="linkedin_url" /></div>
          <div><label><input type="checkbox" name="primary_contact_flag" style="width:auto; display:inline; margin-right:6px;" />Primary contact</label></div>
        </div>
        <div class="flex" style="margin-top:12px; justify-content:flex-end;">
          <button type="button" class="btn" id="cancelContactBtn">Cancel</button>
          <button type="submit" class="btn-primary">Add contact</button>
        </div>
      </form>
    </div>

    <div class="card">
      <h3>Log activity</h3>
      <form id="activityForm">
        <div class="form-row">
          <div>
            <label>Activity type</label>
            <select name="activity_type" id="activityTypeSelect" required></select>
          </div>
          <div>
            <label>Contact</label>
            <select name="contact_id" id="contactSelect"><option value="">(company-level)</option></select>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label>Direction</label>
            <select name="direction"><option value="Outbound">Outbound</option><option value="Inbound">Inbound</option></select>
          </div>
          <div><label>Outcome</label><input name="outcome" /></div>
        </div>
        <div class="form-row" id="meetingAtRow" style="display:none;">
          <div><label>Meeting date/time</label><input name="meeting_at" type="datetime-local" /></div>
        </div>
        <div class="form-row" id="nextStepDueRow" style="display:none;">
          <div><label>Follow-up due</label><input name="next_step_due" type="datetime-local" /></div>
        </div>
        <label>Notes</label>
        <textarea name="notes"></textarea>
        <button type="submit" class="btn-primary" style="margin-top:14px;">Log activity</button>
      </form>
    </div>

    <div class="card">
      <h3>Activity timeline</h3>
      <div id="activityTimeline"></div>
    </div>

    <div class="card">
      <div class="flex-between">
        <h3>Tasks</h3>
        <button id="addTaskBtn" class="btn btn-sm">+ Add task</button>
      </div>
      <div id="tasksBody"></div>
      <form id="taskForm" style="display:none; margin-top:14px;">
        <div class="form-row">
          <div><label>Task type</label><input name="task_type" required placeholder="e.g. Follow-up" /></div>
          <div><label>Due date</label><input name="due_date" type="datetime-local" /></div>
        </div>
        <div class="form-row">
          <div><label>Owner</label><input name="owner" /></div>
          <div>
            <label>Priority</label>
            <select name="priority"><option>P1</option><option>P2</option><option selected>P3</option></select>
          </div>
        </div>
        <div class="flex" style="margin-top:12px; justify-content:flex-end;">
          <button type="button" class="btn" id="cancelTaskBtn">Cancel</button>
          <button type="submit" class="btn-primary">Add task</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="db.js"></script>
  <script>
    const companyId = new URLSearchParams(window.location.search).get('id');
    let company, contacts, userLabel;

    function populateSelect(el, values, includeAll) {
      el.innerHTML = (includeAll ? '<option value="">All</option>' : '') + values.map((v) => `<option value="${v}">${v}</option>`).join('');
    }

    function renderHeader() {
      document.getElementById('companyName').textContent = company.company_name;
      document.getElementById('badgeRow').innerHTML = [
        stageBadge(company.stage), priorityBadge(company.priority), verificationBadge(company.verification_status),
      ].join(' ');
      const form = document.getElementById('companyForm');
      Object.entries(company).forEach(([k, v]) => {
        if (form.elements[k] && v != null) form.elements[k].value = v;
      });
      document.getElementById('qualSummary').textContent = `Status: ${company.qualification_status}` +
        (company.not_qualified_reason ? ` — ${company.not_qualified_reason} (routed to ${company.routing_path})` : '');
      document.getElementById('slaSummary').textContent = company.sla_type
        ? `${company.sla_type}${company.sla_due_at ? ' — due ' + fmtDateTime(company.sla_due_at) : ''}`
        : 'No SLA set';
    }

    function renderContacts() {
      document.getElementById('contactsBody').innerHTML = contacts.map((c) => `
        <tr>
          <td>${c.contact_name}</td>
          <td>${c.title || '—'}</td>
          <td>${c.email || '—'}</td>
          <td>${c.phone_whatsapp || '—'}</td>
          <td>${c.linkedin_url ? `<a href="${c.linkedin_url}" target="_blank">profile</a>` : '—'}</td>
          <td>${c.primary_contact_flag ? '✓' : ''}</td>
          <td>
            <select data-contact-id="${c.id}" class="contact-verify-select">
              <option ${c.verification_status === 'Pending' ? 'selected' : ''}>Pending</option>
              <option ${c.verification_status === 'Verified' ? 'selected' : ''}>Verified</option>
              <option ${c.verification_status === 'Rejected' ? 'selected' : ''}>Rejected</option>
            </select>
          </td>
        </tr>`).join('') || '<tr><td colspan="7" class="empty">No contacts yet.</td></tr>';
      document.querySelectorAll('.contact-verify-select').forEach((sel) => {
        sel.addEventListener('change', async () => {
          await updateContact(sel.dataset.contactId, { verification_status: sel.value });
        });
      });

      const contactSelect = document.getElementById('contactSelect');
      contactSelect.innerHTML = '<option value="">(company-level)</option>' +
        contacts.map((c) => `<option value="${c.id}">${c.contact_name}</option>`).join('');
    }

    async function renderActivities() {
      const activities = await fetchActivities(companyId);
      document.getElementById('activityTimeline').innerHTML = activities.map((a) => `
        <div class="card" style="padding:10px 14px; margin-bottom:8px;">
          <div class="flex-between">
            <strong>${a.activity_type}</strong>
            <span class="text-muted">${fmtDateTime(a.activity_datetime)}</span>
          </div>
          <div class="text-muted">
            ${a.contacts ? a.contacts.contact_name + ' · ' : ''}${a.direction || ''}${a.outcome ? ' · ' + a.outcome : ''}
          </div>
          ${a.notes ? `<div>${a.notes}</div>` : ''}
        </div>`).join('') || '<div class="empty">No activity logged yet.</div>';
    }

    async function renderTasks() {
      const tasks = await fetchTasks({ companyId });
      document.getElementById('tasksBody').innerHTML = tasks.map((t) => `
        <div class="flex-between" style="padding:8px 0; border-bottom:1px solid var(--border);">
          <div>
            <strong>${t.task_type}</strong>
            <span class="text-muted"> — ${t.owner || 'unassigned'} — due ${fmtDateTime(t.due_date)}</span>
            ${isOverdue(t) ? '<span class="badge badge-P1" style="margin-left:6px;">Overdue</span>' : ''}
            ${t.status === 'Completed' ? '<span class="badge badge-verified" style="margin-left:6px;">Done</span>' : ''}
          </div>
          ${t.status === 'Open' ? `<button class="btn btn-sm complete-task-btn" data-id="${t.id}">Complete</button>` : ''}
        </div>`).join('') || '<div class="empty">No tasks for this company.</div>';
      document.querySelectorAll('.complete-task-btn').forEach((btn) => {
        btn.addEventListener('click', async () => { await completeTask(btn.dataset.id); await renderTasks(); });
      });
    }

    document.getElementById('companyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fields = Object.fromEntries(new FormData(e.target).entries());
      Object.keys(fields).forEach((k) => { if (fields[k] === '') fields[k] = null; });
      company = await updateCompany(companyId, fields);
      renderHeader();
    });

    document.getElementById('overrideStageBtn').addEventListener('click', async () => {
      const newStage = prompt(`New stage (one of: ${STAGES.join(', ')})`, company.stage);
      if (!newStage || !STAGES.includes(newStage)) return;
      const reason = prompt('Reason for this override?');
      if (!reason) return;
      await overrideStage(companyId, newStage, reason, userLabel);
      company = await fetchCompany(companyId);
      renderHeader();
    });

    document.getElementById('overridePriorityBtn').addEventListener('click', async () => {
      const newPriority = prompt('New priority (P1, P2, P3)', company.priority);
      if (!newPriority || !PRIORITIES.includes(newPriority)) return;
      const reason = prompt('Reason for this override?');
      if (!reason) return;
      await overridePriority(companyId, newPriority, reason, userLabel);
      company = await fetchCompany(companyId);
      renderHeader();
    });

    document.getElementById('qualifyBtn').addEventListener('click', async () => {
      await qualifyCompany(companyId, 'Qualified', null, null, userLabel);
      company = await fetchCompany(companyId);
      renderHeader();
    });
    document.getElementById('notQualifyBtn').addEventListener('click', async () => {
      const reason = prompt('Reason not qualified?');
      if (!reason) return;
      const routing = prompt('Routing path (Nurture / Recycle or Lost)', 'Nurture / Recycle');
      if (!routing) return;
      await qualifyCompany(companyId, 'Not Qualified', reason, routing, userLabel);
      company = await fetchCompany(companyId);
      renderHeader();
    });

    document.getElementById('addContactBtn').addEventListener('click', () => {
      document.getElementById('contactForm').style.display = 'block';
    });
    document.getElementById('cancelContactBtn').addEventListener('click', () => {
      document.getElementById('contactForm').style.display = 'none';
    });
    document.getElementById('contactForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const fields = Object.fromEntries(new FormData(form).entries());
      fields.company_id = companyId;
      fields.primary_contact_flag = form.elements.primary_contact_flag.checked;
      Object.keys(fields).forEach((k) => { if (fields[k] === '') fields[k] = null; });
      await createContact(fields);
      form.reset();
      form.style.display = 'none';
      contacts = await fetchContacts(companyId);
      renderContacts();
    });

    const activityTypeSelect = document.getElementById('activityTypeSelect');
    activityTypeSelect.addEventListener('change', () => {
      document.getElementById('meetingAtRow').style.display = activityTypeSelect.value.startsWith('Meeting') ? 'flex' : 'none';
      document.getElementById('nextStepDueRow').style.display = activityTypeSelect.value === 'Follow-up scheduled' ? 'flex' : 'none';
    });

    document.getElementById('activityForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const fields = Object.fromEntries(new FormData(form).entries());
      fields.company_id = companyId;
      fields.owner = userLabel;
      Object.keys(fields).forEach((k) => { if (fields[k] === '') fields[k] = null; });
      if (fields.meeting_at) fields.meeting_at = new Date(fields.meeting_at).toISOString();
      if (fields.next_step_due) fields.next_step_due = new Date(fields.next_step_due).toISOString();
      await logActivity(fields);
      form.reset();
      document.getElementById('meetingAtRow').style.display = 'none';
      document.getElementById('nextStepDueRow').style.display = 'none';
      company = await fetchCompany(companyId);
      renderHeader();
      await renderActivities();
      await renderTasks();
    });

    document.getElementById('addTaskBtn').addEventListener('click', () => {
      document.getElementById('taskForm').style.display = 'block';
    });
    document.getElementById('cancelTaskBtn').addEventListener('click', () => {
      document.getElementById('taskForm').style.display = 'none';
    });
    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const fields = Object.fromEntries(new FormData(form).entries());
      fields.company_id = companyId;
      fields.created_from = 'manual';
      Object.keys(fields).forEach((k) => { if (fields[k] === '') fields[k] = null; });
      if (fields.due_date) fields.due_date = new Date(fields.due_date).toISOString();
      await createTask(fields);
      form.reset();
      form.style.display = 'none';
      await renderTasks();
    });

    (async function init() {
      await requireAuth();
      await renderNav('pipeline');
      userLabel = await currentUserLabel();
      populateSelect(document.getElementById('sourceSelect'), SOURCES, false);
      populateSelect(activityTypeSelect, ACTIVITY_TYPES, false);

      company = await fetchCompany(companyId);
      contacts = await fetchContacts(companyId);
      renderHeader();
      renderContacts();
      await renderActivities();
      await renderTasks();
      document.getElementById('page').style.display = 'block';
    })();
  </script>
</body>
</html>
