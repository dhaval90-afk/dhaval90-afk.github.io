<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in — Workhall Leads</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page" style="max-width: 380px; padding-top: 90px;">
    <div class="card">
      <h1>Workhall Leads</h1>
      <p>Sign in with the team account created for you in Supabase.</p>
      <form id="loginForm">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username" />
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" />
        <div id="error" class="text-muted" style="color:#d64545; margin-top:10px; display:none;"></div>
        <button type="submit" class="btn-primary" style="width:100%; margin-top:16px;">Sign in</button>
      </form>
      <p style="margin-top:18px; font-size:0.8rem;">
        No account yet? An admin adds team members from the Supabase dashboard under
        Authentication &gt; Users.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="supabaseClient.js"></script>
  <script>
    (async function () {
      const { data } = await window.sb.auth.getSession();
      if (data.session) window.location.href = 'index.html';
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      const { error } = await window.sb.auth.signInWithPassword({ email, password });
      if (error) {
        errorEl.textContent = error.message;
        errorEl.style.display = 'block';
        return;
      }
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
