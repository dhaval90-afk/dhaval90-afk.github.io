<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pipeline — Workhall Leads</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="nav"></div>
  <div class="page">
    <div class="page-header">
      <h1>Pipeline</h1>
      <div class="flex">
        <button id="viewToggleBtn" class="btn">List view</button>
        <button id="addCompanyBtn" class="btn-primary">+ Add company</button>
      </div>
    </div>

    <div class="filters">
      <input id="searchInput" type="text" placeholder="Search company or domain…" style="min-width:220px;" />
      <select id="sourceFilter"><option value="">All sources</option></select>
      <select id="ownerFilter"><option value="">All owners</option></select>
      <select id="priorityFilter"><option value="">All priorities</option></select>
      <select id="verificationFilter">
        <option value="">All verification</option>
        <option value="Pending">Pending</option>
        <option value="Verified">Verified</option>
        <option value="Rejected">Rejected</option>
      </select>
    </div>

    <div id="boardView" class="board"></div>
    <div id="listView" class="table-wrap" style="display:none;">
      <table>
        <thead>
          <tr>
            <th>Company</th><th>Stage</th><th>Priority</th><th>Source</th><th>Owner</th><th>Verification</th><th>Last activity</th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
  </div>

  <div id="addModal" class="modal-backdrop" style="display:none;">
    <div class="modal">
      <h2>Add company</h2>
      <form id="addCompanyForm">
        <label>Company name *</label>
        <input name="company_name" required />
        <div class="form-row">
          <div><label>Domain</label><input name="domain" placeholder="acme.com" /></div>
          <div><label>Industry</label><input name="industry" /></div>
        </div>
        <div class="form-row">
          <div><label>Company size</label><input name="company_size" placeholder="e.g. 50-200" /></div>
          <div><label>Geography</label><input name="geography" /></div>
        </div>
        <div class="form-row">
          <div><label>Revenue</label><input name="revenue" /></div>
          <div>
            <label>Source</label>
            <select name="source" id="sourceSelect"></select>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label>Source category</label>
            <select name="source_category">
              <option value="Inbound">Inbound</option>
              <option value="Outbound" selected>Outbound</option>
            </select>
          </div>
          <div>
            <label>Priority</label>
            <select name="priority">
              <option>P1</option><option>P2</option><option selected>P3</option>
            </select>
          </div>
        </div>
        <label>Owner</label>
        <input name="owner" />
        <div id="addError" style="color:#d64545; margin-top:10px; display:none;"></div>
        <div class="flex" style="margin-top:18px; justify-content:flex-end;">
          <button type="button" class="btn" id="cancelAddBtn">Cancel</button>
          <button type="submit" class="btn-primary">Add company</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="supabaseClient.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="db.js"></script>
  <script>
    let allCompanies = [];
    let listMode = false;

    function populateSelect(el, values, includeAll) {
      el.innerHTML = (includeAll ? '<option value="">All</option>' : '') + values.map((v) => `<option value="${v}">${v}</option>`).join('');
    }

    function currentFilters() {
      return {
        search: document.getElementById('searchInput').value.trim(),
        source: document.getElementById('sourceFilter').value,
        owner: document.getElementById('ownerFilter').value,
        priority: document.getElementById('priorityFilter').value,
        verification_status: document.getElementById('verificationFilter').value,
      };
    }

    function renderBoard(companies) {
      const board = document.getElementById('boardView');
      board.innerHTML = STAGES.map((stage) => {
        const items = companies.filter((c) => c.stage === stage);
        return `
          <div class="board-col">
            <div class="board-col-header"><span>${stage}</span><span class="text-muted">${items.length}</span></div>
            <div class="board-col-body">
              ${items.map(cardHtml).join('') || '<div class="empty" style="padding:14px;">Empty</div>'}
            </div>
          </div>`;
      }).join('');
      board.querySelectorAll('.lead-card').forEach((el) => {
        el.addEventListener('click', () => (window.location.href = `company.html?id=${el.dataset.id}`));
      });
    }

    function cardHtml(c) {
      return `
        <div class="lead-card" data-id="${c.id}">
          <div class="name">${c.company_name}</div>
          <div class="meta">
            ${priorityBadge(c.priority)}
            ${verificationBadge(c.verification_status)}
            ${c.owner ? `<span class="chip">${c.owner}</span>` : ''}
          </div>
          <div class="meta">${c.source || '—'}</div>
        </div>`;
    }

    function renderList(companies) {
      document.getElementById('listBody').innerHTML = companies.map((c) => `
        <tr onclick="window.location.href='company.html?id=${c.id}'" style="cursor:pointer;">
          <td>${c.company_name}</td>
          <td>${stageBadge(c.stage)}</td>
          <td>${priorityBadge(c.priority)}</td>
          <td>${c.source || '—'}</td>
          <td>${c.owner || '—'}</td>
          <td>${verificationBadge(c.verification_status)}</td>
          <td>${fmtDate(c.last_activity_date)}</td>
        </tr>`).join('') || '<tr><td colspan="7" class="empty">No companies match these filters.</td></tr>';
    }

    async function refresh() {
      allCompanies = await fetchCompanies(currentFilters());
      if (listMode) renderList(allCompanies); else renderBoard(allCompanies);

      const owners = [...new Set(allCompanies.map((c) => c.owner).filter(Boolean))];
      const ownerFilter = document.getElementById('ownerFilter');
      const currentOwner = ownerFilter.value;
      populateSelect(ownerFilter, owners, true);
      ownerFilter.value = currentOwner;
    }

    document.getElementById('viewToggleBtn').addEventListener('click', () => {
      listMode = !listMode;
      document.getElementById('viewToggleBtn').textContent = listMode ? 'Board view' : 'List view';
      document.getElementById('boardView').style.display = listMode ? 'none' : 'flex';
      document.getElementById('listView').style.display = listMode ? 'block' : 'none';
      refresh();
    });

    ['searchInput', 'sourceFilter', 'ownerFilter', 'priorityFilter', 'verificationFilter'].forEach((id) => {
      document.getElementById(id).addEventListener('input', refresh);
      document.getElementById(id).addEventListener('change', refresh);
    });

    document.getElementById('addCompanyBtn').addEventListener('click', () => {
      document.getElementById('addModal').style.display = 'flex';
    });
    document.getElementById('cancelAddBtn').addEventListener('click', () => {
      document.getElementById('addModal').style.display = 'none';
    });
    document.getElementById('addCompanyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const fields = Object.fromEntries(new FormData(form).entries());
      Object.keys(fields).forEach((k) => { if (fields[k] === '') fields[k] = null; });
      try {
        const created = await createCompany(fields);
        document.getElementById('addModal').style.display = 'none';
        form.reset();
        window.location.href = `company.html?id=${created.id}`;
      } catch (err) {
        const el = document.getElementById('addError');
        el.textContent = err.message.includes('companies_domain_unique')
          ? 'A company with this domain already exists.'
          : err.message;
        el.style.display = 'block';
      }
    });

    (async function init() {
      await requireAuth();
      await renderNav('pipeline');
      populateSelect(document.getElementById('sourceFilter'), SOURCES, true);
      populateSelect(document.getElementById('sourceSelect'), SOURCES, false);
      populateSelect(document.getElementById('priorityFilter'), PRIORITIES, true);
      await refresh();
    })();
  </script>
</body>
</html>
